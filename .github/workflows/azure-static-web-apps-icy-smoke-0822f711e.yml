name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# The Free tier allows only three staging environments at once, so a queue of
# superseded runs for one branch can starve the quota and fail later PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # repo_token below posts the preview URL as a PR comment
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # This has to be set HERE, not in Azure. The site is a static export, so
      # `next build` compiles NEXT_PUBLIC_* values straight into the JS bundle --
      # by the time Azure serves it there is no process left to read a setting.
      # It is a `vars` entry rather than a secret: a public endpoint URL is not one.
      - name: Build and export static site
        run: npm run build
        env:
          NEXT_PUBLIC_LEAD_CAPTURE_URL: ${{ vars.NEXT_PUBLIC_LEAD_CAPTURE_URL }}
      # skip_app_build below stops Oryx from running, and nothing else copies this
      # file: without it the vCard redirects and the .vcf MIME type silently vanish.
      - name: Stage routing config alongside the export
        run: cp staticwebapp.config.json out/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SMOKE_0822F711E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # Deploy the export built above instead of letting Oryx build a second
          # copy: only this build has NEXT_PUBLIC_LEAD_CAPTURE_URL baked in.
          app_location: "out" # Pre-built app content, not source, because of skip_app_build
          api_location: ""
          output_location: "" # Must be empty when skip_app_build is true
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_SMOKE_0822F711E }}
          action: "close"
